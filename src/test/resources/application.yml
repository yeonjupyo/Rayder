spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/hackathon_test
    username: hackathon
    password: hackathon
    driver-class-name: org.mariadb.jdbc.Driver

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true

# 컨텍스트 로딩용 더미 값. 실제 외부 호출은 하지 않는다.
environment:
  api:
    data-go-kr-service-key: test-service-key
    kakao-rest-api-key: test-rest-api-key
