spring:
  application:
    name: backend
  profiles:
    # 배포 환경에서는 SPRING_PROFILES_ACTIVE 로 덮어쓴다. 기본값은 로컬 개발.
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: 8080

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

environment:
  api:
    data-go-kr-service-key: ${DATA_GO_KR_SERVICE_KEY}
    kakao-rest-api-key: ${KAKAO_REST_API_KEY}

ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com
    chat-model: gpt-4o-mini
    embedding-model: text-embedding-3-small
    connect-timeout: 3000
    read-timeout: 30000
    max-attempts: 2
  rag:
    resource: classpath:rag/Rayder_RAG.pdf
    chunk-size: 900
    chunk-overlap: 150
    top-k: 4
    minimum-similarity: 0.15

notification:
  zone-id: Asia/Seoul
  expo:
    enabled: ${EXPO_PUSH_ENABLED:false}
    access-token: ${EXPO_ACCESS_TOKEN:}
    send-url: https://exp.host/--/api/v2/push/send
    receipts-url: https://exp.host/--/api/v2/push/getReceipts
