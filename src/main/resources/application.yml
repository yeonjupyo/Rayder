spring:
  application:
    name: backend
  profiles:
    active: local

server:
  port: 8080

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.likelion.backend
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
